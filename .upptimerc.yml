# Upptime configuration — OIT public-facing status monitor
# Docs: https://upptime.js.org/docs/configuration
#
# TODO before first push: set `owner` to the new GitHub org handle (e.g. oit-tn).
owner: TunisianEngineersOrder # <-- replace with the new org handle
repo: status

# ---------------------------------------------------------------------------
# Monitored endpoints (public-facing only — reachable from GitHub cloud runners)
# ---------------------------------------------------------------------------
sites:
  # ---- P0: crown-jewel public apps everyone uses -------------------------
  - name: OIT Website
    url: https://www.oit.org.tn
    # apex oit.org.tn is intentionally NOT monitored: its cert has no SAN for
    # the apex and it only redirects — www is the real health signal.

  - name: Tableau
    url: https://tableau.oit.org.tn
    # Tableau front page returns 403 (auth gate) while perfectly healthy.
    # Without this, Upptime would report it permanently DOWN.
    expectedStatusCodes:
      - 200
      - 302
      - 403

  # ---- P1: identity + dev platform (everything else depends on these) -----
  - name: SSO (Authentik)
    url: https://auth.dev.oit.org.tn
    expectedStatusCodes:
      - 200
      - 302

  - name: GitLab
    url: https://gitlab.dev.oit.org.tn

  # ---- P2: supporting public services ------------------------------------
  - name: Support (GLPI)
    url: https://support.oit.org.tn
    expectedStatusCodes:
      - 200
      - 302
      - 403

  - name: AI Service
    url: https://ai-svc.dev.oit.org.tn
    expectedStatusCodes:
      - 200
      - 401
      - 403
      - 404

  - name: Komodo
    url: https://komodo.dev.oit.org.tn
    expectedStatusCodes:
      - 200
      - 302
      - 401

  - name: Container Registry
    url: https://registry.dev.oit.org.tn
    expectedStatusCodes:
      - 200
      - 401 # registries answer 401 to unauthenticated GETs — that means UP

  # NOTE: IP-level edge checks (TCP-ping to the FortiGate WANs) were removed —
  # the firewalls drop unsolicited probes, so they always read "down". The app
  # checks above already traverse each edge, so app-up implies edge-up.

# ---------------------------------------------------------------------------
# Incidents / notifications
# ---------------------------------------------------------------------------
# GitHub Issues only for now: every down event auto-opens an issue and
# auto-closes on recovery. Assign so someone is pinged.
assignees:
  - aabichou

# ---------------------------------------------------------------------------
# Status page
# ---------------------------------------------------------------------------
status-website:
  # cname: status.oit.org.tn
  # ^ re-enable ONLY after adding DNS: CNAME status.oit.org.tn -> tunisianengineersorder.github.io
  #   (right now status.oit.org.tn resolves to OIT infra 197.25.139.14 via wildcard, which hijacks it)
  name: OIT Status
  introTitle: "**OIT** service status"
  introMessage: Live availability of OIT's public-facing services.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/TunisianEngineersOrder/status
